name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            artifact: AraChat-macos-arm64
            bundle: dmg
            path: apps/pc/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            artifact: AraChat-windows-x64
            bundle: nsis
            path: apps/pc/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4
        with:
          # The design-reference archive contains paths that exceed the Windows
          # filesystem limit but is not used to package the Desktop client.
          sparse-checkout: |
            apps/pc
            apps/web/public/icons
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pc/src-tauri
      - run: npm ci
      - run: npm --workspace @arachat/desktop run tauri -- build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
