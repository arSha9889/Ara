name: nexus-production

x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      POSTGRES_DB: ${NEXUS_POSTGRES_DB:-nexus}
      POSTGRES_USER: ${NEXUS_POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD in deploy/production.env}
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *container-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --maxmemory
      - ${NEXUS_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    logging: *container-logging
    environment:
      NEXUS_ENVIRONMENT: production
      NEXUS_DATABASE_URL: postgresql+asyncpg://${NEXUS_POSTGRES_USER:-nexus}:${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD in deploy/production.env}@postgres:5432/${NEXUS_POSTGRES_DB:-nexus}
      NEXUS_REDIS_URL: redis://redis:6379/0
      NEXUS_ALLOWED_ORIGINS: ${NEXUS_ALLOWED_ORIGINS:?Set NEXUS_ALLOWED_ORIGINS in deploy/production.env}
      NEXUS_PUBLIC_BASE_URL: ${NEXUS_PUBLIC_BASE_URL:?Set NEXUS_PUBLIC_BASE_URL in deploy/production.env}
      NEXUS_STORAGE_BACKEND: s3
      NEXUS_S3_ENDPOINT_URL: ${NEXUS_S3_ENDPOINT_URL:?Set NEXUS_S3_ENDPOINT_URL in deploy/production.env}
      NEXUS_S3_REGION: ${NEXUS_S3_REGION:-auto}
      NEXUS_S3_BUCKET: ${NEXUS_S3_BUCKET:?Set NEXUS_S3_BUCKET in deploy/production.env}
      NEXUS_S3_ACCESS_KEY_ID: ${NEXUS_S3_ACCESS_KEY_ID:?Set NEXUS_S3_ACCESS_KEY_ID in deploy/production.env}
      NEXUS_S3_SECRET_ACCESS_KEY: ${NEXUS_S3_SECRET_ACCESS_KEY:?Set NEXUS_S3_SECRET_ACCESS_KEY in deploy/production.env}
      NEXUS_S3_PREFIX: ${NEXUS_S3_PREFIX:-uploads}
      NEXUS_REGISTRATION_PROOF_SECRET: ${NEXUS_REGISTRATION_PROOF_SECRET:?Set NEXUS_REGISTRATION_PROOF_SECRET in deploy/production.env}
      NEXUS_ACCESS_TOKEN_SECRET: ${NEXUS_ACCESS_TOKEN_SECRET:?Set NEXUS_ACCESS_TOKEN_SECRET in deploy/production.env}
      NEXUS_SMTP_HOST: ${NEXUS_SMTP_HOST:?Set NEXUS_SMTP_HOST in deploy/production.env}
      NEXUS_SMTP_PORT: ${NEXUS_SMTP_PORT:-587}
      NEXUS_SMTP_USERNAME: ${NEXUS_SMTP_USERNAME:-}
      NEXUS_SMTP_PASSWORD: ${NEXUS_SMTP_PASSWORD:-}
      NEXUS_SMTP_FROM_EMAIL: ${NEXUS_SMTP_FROM_EMAIL:?Set NEXUS_SMTP_FROM_EMAIL in deploy/production.env}
      NEXUS_SMTP_FROM_NAME: ${NEXUS_SMTP_FROM_NAME:-AraChat}
      NEXUS_SMTP_USE_STARTTLS: ${NEXUS_SMTP_USE_STARTTLS:-true}
      NEXUS_SMTP_USE_SSL: ${NEXUS_SMTP_USE_SSL:-false}
      NEXUS_SMTP_TIMEOUT_SECONDS: ${NEXUS_SMTP_TIMEOUT_SECONDS:-15}
      NEXUS_YANDEX_OAUTH_CLIENT_ID: ${NEXUS_YANDEX_OAUTH_CLIENT_ID:-}
      NEXUS_YANDEX_OAUTH_CLIENT_SECRET: ${NEXUS_YANDEX_OAUTH_CLIENT_SECRET:-}
      NEXUS_VK_OAUTH_CLIENT_ID: ${NEXUS_VK_OAUTH_CLIENT_ID:-}
      NEXUS_VK_OAUTH_SERVICE_TOKEN: ${NEXUS_VK_OAUTH_SERVICE_TOKEN:-}
      NEXUS_TELEGRAM_BOT_TOKEN: ${NEXUS_TELEGRAM_BOT_TOKEN:-}
      NEXUS_TELEGRAM_BOT_NAME: ${NEXUS_TELEGRAM_BOT_NAME:-}
      NEXUS_TELEGRAM_WEBHOOK_SECRET: ${NEXUS_TELEGRAM_WEBHOOK_SECRET:-}
      NEXUS_ADMIN_EMAIL: ${NEXUS_ADMIN_EMAIL:-}
      NEXUS_ADMIN_PHONE: ${NEXUS_ADMIN_PHONE:-}
      NEXUS_VAPID_PRIVATE_KEY: ${NEXUS_VAPID_PRIVATE_KEY:-}
      NEXUS_VAPID_PUBLIC_KEY: ${NEXUS_VAPID_PUBLIC_KEY:-}
      NEXUS_VAPID_CLAIMS_EMAIL: ${NEXUS_VAPID_CLAIMS_EMAIL:-}
      NEXUS_MOBILE_PUSH_ENABLED: ${NEXUS_MOBILE_PUSH_ENABLED:-true}
      NEXUS_FCM_PUSH_ENABLED: ${NEXUS_FCM_PUSH_ENABLED:-false}
      NEXUS_MOBILE_PUSH_TIMEOUT_SECONDS: ${NEXUS_MOBILE_PUSH_TIMEOUT_SECONDS:-10}
      NEXUS_RUSTORE_PUSH_PROJECT_ID: ${NEXUS_RUSTORE_PUSH_PROJECT_ID:-}
      NEXUS_RUSTORE_PUSH_SERVICE_TOKEN: ${NEXUS_RUSTORE_PUSH_SERVICE_TOKEN:-}
      NEXUS_FCM_PUSH_PROJECT_ID: ${NEXUS_FCM_PUSH_PROJECT_ID:-}
      NEXUS_FCM_SERVICE_ACCOUNT_FILE: ${NEXUS_FCM_SERVICE_ACCOUNT_FILE:-}
      NEXUS_ANDROID_LATEST_VERSION_CODE: ${NEXUS_ANDROID_LATEST_VERSION_CODE:-}
      NEXUS_ANDROID_LATEST_VERSION_NAME: ${NEXUS_ANDROID_LATEST_VERSION_NAME:-}
      NEXUS_ANDROID_RELEASE_NOTES_RU: ${NEXUS_ANDROID_RELEASE_NOTES_RU:-[]}
      NEXUS_ANDROID_RELEASE_NOTES_EN: ${NEXUS_ANDROID_RELEASE_NOTES_EN:-[]}
      NEXUS_ANDROID_DIRECT_DOWNLOAD_URL: ${NEXUS_ANDROID_DIRECT_DOWNLOAD_URL:-}
      NEXUS_ANDROID_RUSTORE_APP_URL: ${NEXUS_ANDROID_RUSTORE_APP_URL:-}
      NEXUS_ANDROID_RUSTORE_INSTALLER_PACKAGE: ${NEXUS_ANDROID_RUSTORE_INSTALLER_PACKAGE:-}
      NEXUS_TURN_PUBLIC_HOST: ${NEXUS_TURN_PUBLIC_HOST:-}
      NEXUS_TURN_SHARED_SECRET: ${NEXUS_TURN_SHARED_SECRET:-}
      NEXUS_TURN_PORT: ${NEXUS_TURN_PORT:-3478}
      NEXUS_TURN_CREDENTIAL_TTL_SECONDS: ${NEXUS_TURN_CREDENTIAL_TTL_SECONDS:-3600}
      NEXUS_ACCESS_TOKEN_MINUTES: ${NEXUS_ACCESS_TOKEN_MINUTES:-15}
      NEXUS_REFRESH_TOKEN_DAYS: ${NEXUS_REFRESH_TOKEN_DAYS:-180}
      NEXUS_PIN_TRUSTED_DAYS: ${NEXUS_PIN_TRUSTED_DAYS:-365}
      NEXUS_EARLY_ACCESS_BYPASS_LIMIT: ${NEXUS_EARLY_ACCESS_BYPASS_LIMIT:-0}
      NEXUS_UPLOAD_MAX_SIZE_BYTES: ${NEXUS_UPLOAD_MAX_SIZE_BYTES:-31457280}
      NEXUS_MAINTENANCE_STATUS_FILE: /var/lib/arachat/maintenance/storage-status.json
    volumes:
      - /var/lib/arachat/maintenance:/var/lib/arachat/maintenance:ro
      - ${NEXUS_FCM_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/arachat-fcm-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    logging: *container-logging
    environment:
      PORT: 8080
      NEXUS_API_UPSTREAM: http://api:8000
      VITE_API_BASE_URL: ""
      VITE_WS_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"

  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    logging: *container-logging
    profiles: ["calls"]
    network_mode: host
    command:
      - --realm=${NEXUS_TURN_REALM:?Set NEXUS_TURN_REALM in deploy/production.env}
      - --server-name=${NEXUS_TURN_PUBLIC_HOST:?Set NEXUS_TURN_PUBLIC_HOST in deploy/production.env}
      - --listening-port=${NEXUS_TURN_PORT:-3478}
      - --min-port=${NEXUS_TURN_MIN_PORT:-49160}
      - --max-port=${NEXUS_TURN_MAX_PORT:-49200}
      - --external-ip=${NEXUS_TURN_EXTERNAL_IP:?Set NEXUS_TURN_EXTERNAL_IP in deploy/production.env}
      - --listening-ip=${NEXUS_TURN_EXTERNAL_IP:?Set NEXUS_TURN_EXTERNAL_IP in deploy/production.env}
      - --relay-ip=${NEXUS_TURN_EXTERNAL_IP:?Set NEXUS_TURN_EXTERNAL_IP in deploy/production.env}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${NEXUS_TURN_SHARED_SECRET:?Set NEXUS_TURN_SHARED_SECRET in deploy/production.env}
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=${NEXUS_TURN_TOTAL_QUOTA:-120}
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --no-tls

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *container-logging
    networks:
      default:
      caddy_proxy:
    environment:
      NEXUS_PUBLIC_DOMAIN: ${NEXUS_PUBLIC_DOMAIN:?Set NEXUS_PUBLIC_DOMAIN in deploy/production.env}
      NEXUS_ACME_EMAIL: ${NEXUS_ACME_EMAIL:?Set NEXUS_ACME_EMAIL in deploy/production.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nexus_caddy_data:/data
      - nexus_caddy_config:/config
    depends_on:
      - web

volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_caddy_data:
  nexus_caddy_config:

networks:
  caddy_proxy:
