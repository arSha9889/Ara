        16% { opacity: 1; }
        66% { opacity: 0; transform: translate(34px, -24px) rotate(-10deg); }
        100% { opacity: 0; transform: translate(34px, -24px) rotate(-10deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .arachat-loader-paper-plane { animation: none; opacity: 1; }
      }
    </style>
