[package]
name = "arachat-desktop"
version = "0.1.0"
description = "AraChat Desktop client"
authors = ["AraChat"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arachat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSGlassEffectView", "NSResponder", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo", "NSString"] }
tokio = { version = "1", features = ["sync"] }
